name: Mobile CI

on:
  pull_request:
  push:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=API_BASE_URL=https://api.example.invalid
      - run: flutter build appbundle --release --dart-define=API_BASE_URL=https://api.example.invalid
      - uses: actions/upload-artifact@v7
        with:
          name: android-app-bundle-unsigned
          path: build/app/outputs/bundle/release/app-release.aab

  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://api.example.invalid
